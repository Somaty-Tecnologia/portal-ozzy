# Roda no banco (Supabase) as migrations novas de supabase/migrations, em ordem, uma vez cada
# (combinado com o Heitor em 08/10). Usa o mesmo secret do backup (SUPABASE_DB_URL).
# Antes de mexer, tira um backup do schema public. Cada migration roda numa transação só:
# se der erro, nada dela fica aplicado e a rotina para.
# Branch "teste" (08/10): mesma coisa no banco do ambiente de testes (secret SUPABASE_TESTE_DB_URL), rodando todas
# desde a 0001 e depois os dados fictícios de supabase/teste. O banco real nunca é tocado a partir do "teste".
name: Rodar migrations

on:
  push:
    branches: [main, teste]
    paths: ['supabase/migrations/**', 'supabase/teste/**']
  workflow_dispatch:
    inputs:
      marcar_como_aplicadas:
        description: 'Migrations já rodadas à mão no SQL Editor (nomes sem .sql, separados por vírgula)'
        required: false
        default: ''

concurrency: migrations-${{ github.ref_name }}

jobs:
  migrations:
    runs-on: ubuntu-latest
    # Sem contêiner (15/10: o espelho da imagem também falhou): instala o psql/pg_dump 17 do repositório oficial do Postgres.
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o cliente do Postgres 17
        run: |
          for t in 1 2 3; do
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null && sudo apt-get install -y -q postgresql-client-17 > /dev/null && break
            sleep 10
          done
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Aplicar as que faltam
        env:
          SUPABASE_DB_URL: ${{ github.ref_name == 'teste' && secrets.SUPABASE_TESTE_DB_URL || github.ref_name == 'main' && secrets.SUPABASE_DB_URL || '' }}
          # Até a 0027 o Heitor rodou à mão no SQL Editor (08/10). O banco de teste nasce vazio.
          JA_RODADAS_ATE: ${{ github.ref_name == 'teste' && '0000' || '0027' }}
          TESTE: ${{ github.ref_name == 'teste' && '1' || '' }}
          MARCAR: ${{ github.event.inputs.marcar_como_aplicadas }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::notice title=Sem banco::Nenhum banco configurado para o branch ${GITHUB_REF_NAME}; nada a fazer."; exit 0; fi
          if ! psql "$SUPABASE_DB_URL" -At -c "select 1" > /dev/null 2> erro.txt; then
            echo "::error title=Não conectou no banco::$(tr '\n' ' ' < erro.txt | cut -c1-900)"; exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "create table if not exists public._migracoes (nome text primary key, aplicada_em timestamptz not null default now())" \
            -c "alter table public._migracoes enable row level security"
          # Rodadas à mão depois que a rotina existe: só registra, não roda de novo.
          for n in $(echo "$MARCAR" | tr ',' ' '); do
            case "$n" in *[!A-Za-z0-9_]*) echo "::error title=Nome inválido::$n"; exit 1;; esac
            [ -f "supabase/migrations/$n.sql" ] || { echo "::error title=Não existe::$n"; exit 1; }
            psql "$SUPABASE_DB_URL" -q -c "insert into public._migracoes (nome) values ('$n') on conflict do nothing"
            echo "::notice title=Marcada como aplicada::$n"
          done
          # Registra as que já foram rodadas à mão (só faz efeito na primeira vez).
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" .sql)
            num=${n%%_*}
            if [ "$num" -le "$JA_RODADAS_ATE" ] 2>/dev/null; then
              psql "$SUPABASE_DB_URL" -q -c "insert into public._migracoes (nome) values ('$n') on conflict do nothing"
            fi
          done
          aplicadas=$(psql "$SUPABASE_DB_URL" -At -c "select nome from public._migracoes")
          mkdir -p backup
          fez_backup=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f" .sql)
            if echo "$aplicadas" | grep -qx "$n"; then continue; fi
            if [ $fez_backup = 0 ]; then
              pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --schema=public | gzip > backup/antes-das-migrations.sql.gz
              fez_backup=1
            fi
            echo "::group::$n"
            if ! psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f" \
              -c "insert into public._migracoes (nome) values ('$n')" 2> erro.txt; then
              cat erro.txt
              echo "::endgroup::"
              # Aparece no resumo da execução (e para o Claude conferir sem baixar o log).
              echo "::error title=$n não foi aplicada::$(tr '\n' ' ' < erro.txt | cut -c1-900)"
              exit 1
            fi
            echo "::endgroup::"
            echo "::notice title=Aplicada::$n"
          done
          [ $fez_backup = 1 ] || echo "::notice title=Banco em dia::Nenhuma migration nova."
          if [ -n "$TESTE" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/teste/dados-de-teste.sql 2> erro.txt \
              || { echo "::error title=Dados de teste::$(tr '\n' ' ' < erro.txt | cut -c1-900)"; exit 1; }
            echo "::notice title=Dados de teste::Pessoas de teste criadas e ligadas aos logins que existem."
          fi

      - name: Guardar o backup de antes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antes-das-migrations-${{ github.run_number }}
          path: backup/
          retention-days: 90
          if-no-files-found: ignore
